name: Release

# Builds the plugin and publishes it as a GitHub release. Start it from the
# Actions tab ("Run workflow", enter a version like v2.5.0) or push a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. v2.5.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Backend tests
        run: python3 -m unittest discover -s tests
      - name: Build and package
        run: bash scripts/package.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.version || github.ref_name }}"
          gh release create "$TAG" release/legion-go-toolbox.zip \
            docs/Legion-Go-Toolbox-Manual.pdf \
            --target "$GITHUB_SHA" \
            --title "LeGo Decky Toolbox $TAG" \
            --notes "Install: Decky → Developer → Install plugin from ZIP file → legion-go-toolbox.zip. The user manual is attached as a PDF."
